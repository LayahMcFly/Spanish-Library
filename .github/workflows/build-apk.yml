name: Build debug APK
on:
  workflow_dispatch:
jobs:
  apk:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - name: Install Capacitor
        working-directory: capacitor
        run: npm install --no-audit --no-fund
      - name: Copy web app into Android project
        working-directory: capacitor
        run: npx cap sync android
      - name: Build debug APK
        working-directory: capacitor/android
        run: |
          chmod +x gradlew
          ./gradlew assembleDebug
      - uses: actions/upload-artifact@v4
        with:
          name: biblioteca-de-las-rosas-debug-apk
          path: capacitor/android/app/build/outputs/apk/debug/app-debug.apk
